<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[TV] ESG 공급망 관리 시스템 - 기업 정보 관리</title>
  <!-- Tailwind CSS 4.0 브라우저 빌드 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- 공통 스타일 -->
  <link rel="stylesheet" href="../assets/css/global.css">
  <!-- Tailwind 커스텀 테마 설정 -->
  <style type="tailwindcss">
    @theme {
      --color-primary-green: #03a94d;
      --color-primary-dark-green: #02823b;
    }
  </style>
</head>

<body class="bg-gray-50 overflow-hidden font-sans">
  <div class="flex h-screen overflow-hidden">
    <!-- SidebarNav (좌측 레이어) -->
    <aside
      class="fixed inset-y-0 left-0 z-50 w-56 bg-primary-green text-emerald-100 flex flex-col shrink-0 transition-transform duration-300 transform -translate-x-full md:relative md:translate-x-0 sidebar">
      <div class="p-4 border-b border-emerald-600/30 flex items-center justify-between">
        <div style="cursor: pointer;"
          class="w-full flex items-center justify-center bg-white h-16 rounded-lg shadow-sm overflow-hidden"
          onclick="location.href='../admin/dashboard.html'">
          <img src="../assets/logos/TVLogo.png" alt="Triple Values" class="w-full h-full object-contain scale-[1.35]" />
        </div>
      </div>
      <nav class="flex-1 p-2 space-y-6 overflow-y-auto">
        <!-- 카테고리: 협력사 파트너 포털 -->
        <div class="space-y-2">
          <p class="px-3 text-xs font-bold text-emerald-200 tracking-wide">■ 협력사 파트너 포털</p>
          <div class="space-y-1">
            <!-- 기업 정보 관리 (활성화 상태) -->
            <a href="companyInfo.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold transition text-left bg-primary-dark-green text-white">
              <span>기업 정보 관리</span>
            </a>
            <!-- 협력사 정보 -->
            <a href="partnerSubList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>협력사 정보</span>
            </a>
            <!-- 원자재 관리 -->
            <a href="MaterialManage.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>원자재 관리</span>
            </a>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area (우측 레이어) -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- HeaderNav -->
      <header class="bg-white border-b border-gray-100 flex items-center justify-between px-6 py-3 shrink-0 relative">
        <div class="flex items-center gap-3">
          <!-- 햄버거 메뉴 버튼 -->
          <button class="p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg md:hidden" id="btn-sidebar-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h1 class="text-base md:text-lg font-bold text-gray-800">ESG 공급망 관리 시스템</h1>
        </div>
        <div class="flex items-center gap-4">
          <!-- 역할 전환 셀렉트 박스 -->
          <div class="flex items-center gap-2">
            <select
              class="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 font-semibold focus:ring-1 focus:ring-[#03a94d] focus:border-[#03a94d] cursor-pointer"
              onchange="location.href=(this.value === '현대모비스' ? '../admin/dashboard.html' : 'companyInfo.html')">
              <option value="현대모비스">원청사 (현대모비스)</option>
              <option value="1차 협력사" selected>1차 협력사 (노벨리스코리아)</option>
              <option value="2차 협력사">2차 협력사 (케이알엠)</option>
              <option value="3차 협력사">3차 협력사 (Comilog)</option>
            </select>
          </div>

          <!-- 알림 센터 -->
          <div class="relative">
            <button class="relative p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span
                class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold">3</span>
            </button>
          </div>

          <!-- 역할 표시 -->
          <span class="text-xs text-gray-600 font-semibold">1차 협력사 관리자</span>
        </div>
      </header>

      <!-- Content Body -->
      <main class="flex-1 overflow-y-auto p-6 space-y-5">
        <!-- 협력사 기업 정보 관리 및 자가진단 증빙 제출 구역 -->
        <div>
          <h1 class="text-2xl font-black text-gray-900">기업 정보 관리</h1>
          <p class="text-sm text-gray-400 mt-1">플랫폼 연동을 위한 협력사 기본 정보 및 글로벌 인증 자산 마스터 관리</p>
        </div>

        <!-- 정중앙 프리미엄 웰컴 카드 스크린 -->
        <div id="company-welcome-screen" class="bg-white rounded-xl border border-gray-100 p-8 shadow-sm text-center max-w-2xl mx-auto my-12 space-y-6">
          <div class="flex flex-col items-center justify-center">
            <!-- 연한 그린 배경의 단정한 원형 레이어 -->
            <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center text-[#03a94d] mb-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0V9a2 2 0 012-2h2a2 2 0 012 2v12m-6 0h6" />
              </svg>
            </div>
            <h2 class="text-xl md:text-2xl font-bold text-gray-900">ESG 공급망 플랫폼 협력사 포털 진입을 환영합니다</h2>
          </div>

          <!-- 안내 본문 단 -->
          <p class="text-sm text-gray-600 leading-relaxed max-w-lg mx-auto">
            ESG 플랫폼 시스템을 안전하게 이용하시기 위해 최초 1회 기업 정보 등록 및 인증 증빙 서류 제출이 필요합니다.
          </p>

          <!-- 핵심 액션 단추 배치 -->
          <div class="pt-2">
            <a id="btn-register-company" class="px-6 py-3 text-white text-sm rounded-lg font-bold bg-[#03a94d] hover:bg-[#02823b] transition shadow-md inline-block cursor-pointer">
              기업 정보 등록하기
            </a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Sidebar Mobile Toggle
    const btnSidebarToggle = document.getElementById('btn-sidebar-toggle');
    const sidebar = document.querySelector('.sidebar');

    if (btnSidebarToggle && sidebar) {
      btnSidebarToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        sidebar.classList.toggle('-translate-x-full');
      });
      document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !btnSidebarToggle.contains(e.target)) {
          sidebar.classList.add('-translate-x-full');
        }
      });
    }
  </script>
</body>

</html>
