<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[TV] ESG 공급망 관리 시스템 - 리스크 현황</title>
  <!-- Tailwind CSS 4.0 브라우저 빌드 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- 공통 스타일 -->
  <link rel="stylesheet" href="../assets/css/global.css">
  <!-- Tailwind 커스텀 테마 설정 -->
  <style type="tailwindcss">
    @theme {
      --color-primary-green: #03a94d;
      --color-primary-dark-green: #02823b;
    }
  </style>
</head>

<body class="bg-gray-50 overflow-hidden font-sans">
  <div class="flex h-screen overflow-hidden">
    <!-- SidebarNav (좌측 레이어) -->
    <aside
      class="fixed inset-y-0 left-0 z-50 w-56 bg-primary-green text-emerald-100 flex flex-col shrink-0 transition-transform duration-300 transform -translate-x-full md:relative md:translate-x-0 sidebar">
      <div class="p-4 border-b border-emerald-600/30 flex items-center justify-between">
        <div style="cursor: pointer;"
          class="w-full flex items-center justify-center bg-white h-16 rounded-lg shadow-sm overflow-hidden">
          <img src="../assets/logos/TVLogo.png" alt="Triple Values" class="w-full h-full object-contain scale-[1.35]" />
        </div>
      </div>
      <nav class="flex-1 p-2 space-y-6 overflow-y-auto">
        <!-- 카테고리: 기준 및 협력사 정보 -->
        <div class="space-y-2">
          <p class="px-3 text-xs font-bold text-emerald-200 tracking-wide">■ 기준 및 협력사 정보</p>
          <div class="space-y-1">
            <!-- 메인 대시보드 -->
            <a href="dashboard.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>메인 대시보드</span>
            </a>
            <!-- 협력사 정보 -->
            <a href="partnerList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>협력사 정보</span>
            </a>
            <!-- BOM 관리 -->
            <a href="bomList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>BOM 관리</span>
            </a>
          </div>
        </div>
        <!-- 카테고리: 구매 및 자재 관리 -->
        <div class="space-y-2">
          <p class="px-3 text-xs font-bold text-emerald-200 tracking-wide">■ 구매 및 자재 관리</p>
          <div class="space-y-1">
            <!-- PO 관리 -->
            <a href="poList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>PO 관리</span>
            </a>
            <!-- 원자재 관리 -->
            <a href="materialList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>원자재 관리</span>
            </a>
          </div>
        </div>
        <!-- 카테고리: 실사 및 평가 -->
        <div class="space-y-2">
          <p class="px-3 text-xs font-bold text-emerald-200 tracking-wide">■ 실사 및 평가</p>
          <div class="space-y-1">
            <!-- 리스크 현황 (활성화 상태) -->
            <a href="riskList.html"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold transition text-left bg-primary-dark-green text-white">
              <span>리스크 현황</span>
            </a>
            <!-- 현장 실사 -->
            <a href="#"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition text-left text-emerald-100 hover:bg-emerald-600/50 hover:text-white">
              <span>현장 실사</span>
              <span class="text-xs px-1.5 py-0.5 rounded-full font-bold bg-amber-400 text-white">3건</span>
            </a>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area (우측 레이어) -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- HeaderNav -->
      <header class="bg-white border-b border-gray-100 flex items-center justify-between px-6 py-3 shrink-0 relative">
        <div class="flex items-center gap-3">
          <!-- 햄버거 메뉴 버튼 -->
          <button class="p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg md:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h1 class="text-base md:text-lg font-bold text-gray-800">ESG 공급망 관리 시스템</h1>
        </div>
        <div class="flex items-center gap-4">
          <!-- 역할 전환 셀렉트 박스 -->
          <div class="flex items-center gap-2">
            <select
              class="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 font-semibold focus:ring-1 focus:ring-[#03a94d] focus:border-[#03a94d] cursor-pointer">
              <option value="현대모비스" selected>원청사 (현대모비스)</option>
              <option value="1차 협력사">1차 협력사 (노벨리스코리아)</option>
              <option value="2차 협력사">2차 협력사 (케이알엠)</option>
              <option value="3차 협력사">3차 협력사 (Comilog)</option>
            </select>
          </div>

          <!-- 알림 센터 -->
          <div class="relative">
            <button class="relative p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span
                class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold">3</span>
            </button>
          </div>

          <!-- 역할 표시 -->
          <span class="text-xs text-gray-600 font-semibold">원청사 관리자</span>
        </div>
      </header>

      <!-- Content Body -->
      <main class="flex-1 overflow-y-auto p-6 space-y-5">
        <!-- 리스크 현황 관제 본체 데이터 마크업 주입 예정 구역 -->
      </main>
    </div>
  </div>
</body>

</html>
